name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name "L-GPT" `
            --icon "assets/lgpt.ico" `
            --add-data "assets;assets" `
            --collect-all pymupdf `
            --collect-all ollama `
            --collect-all reportlab `
            --hidden-import fitz `
            --hidden-import numpy `
            --hidden-import core.pdf_engine `
            main.py

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/L-GPT/*" -DestinationPath "dist/L-GPT-Windows-portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=3.1.0" "installer/L-GPT.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: L-GPT-Windows
          path: |
            dist/L-GPT-Windows-portable.zip
            dist/installer/L-GPT-Setup-3.1.0.exe
          if-no-files-found: error
